# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update smarthomeguys/deskup-pro-controller-rj12 Package Revision
pipelineid: update-smarthomeguys-deskup-pro-controller-rj12-package-revision
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/smarthomeguys/deskup-pro-controller-rj12.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  devices:
    kind: file
    sourceid: version
    spec:
      matchpattern: (github://smarthomeguys/deskup\-pro\-controller\-rj12(?:/[^@\s]+)?@)[a-f0-9]{40}
      replacepattern: ${1}{{ source "version" }}
      files:
        - spare-room-desk.yaml
