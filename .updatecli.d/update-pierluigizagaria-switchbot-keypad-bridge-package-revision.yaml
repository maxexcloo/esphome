# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update pierluigizagaria/switchbot-keypad-bridge Package Revision
pipelineid: update-pierluigizagaria-switchbot-keypad-bridge-package-revision
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/pierluigizagaria/switchbot-keypad-bridge.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  devices:
    kind: file
    sourceid: version
    spec:
      matchpattern: (github://pierluigizagaria/switchbot\-keypad\-bridge(?:/[^@\s]+)?@)[a-f0-9]{40}
      replacepattern: ${1}{{ source "version" }}
      files:
        - hallway-front-door-keypad.yaml
