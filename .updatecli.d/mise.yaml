# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Mise
pipelineid: update-mise
labels:
  group: mise
targets:
  tools:
    disablesourceinput: true
    kind: shell
    spec:
      command: |
        # Python follows its separate 3.14 compatibility policy.
        updates=$(mise outdated --bump --json --local pipx:esphome) || exit "$?"
        if [ "$updates" = "{}" ]; then
          exit 0
        fi
        if [ "$DRY_RUN" = false ]; then
          mise upgrade --bump --local --no-prune pipx:esphome || exit "$?"
        fi
        printf '%s\n' "$updates"
