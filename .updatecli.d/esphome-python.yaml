# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ESPHome-Compatible Python
pipelineid: update-esphome-compatible-python
labels:
  group: tools
sources:
  version:
    kind: shell
    spec:
      command: mise latest python@3.14
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: .mise.toml
      matchpattern: (uvx_args = "--python )[0-9.]+(")
      replacepattern: ${1}{{ source "version" }}${2}
