# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Development Tools
pipelineid: update-development-tools
labels:
  group: tools
sources:
  pipx-esphome:
    kind: shell
    spec:
      command: mise latest pipx:esphome
  python:
    kind: shell
    spec:
      command: mise latest python
  ruff:
    kind: shell
    spec:
      command: mise latest ruff
  updatecli:
    kind: shell
    spec:
      command: mise latest updatecli
targets:
  pipx-esphome:
    kind: file
    sourceid: pipx-esphome
    spec:
      file: .mise.toml
      matchpattern: (?m)^("pipx:esphome" = \{[^\n]*version = ")[^"]+("[^\n]*\})$
      replacepattern: ${1}{{ source "pipx-esphome" }}${2}
  python:
    kind: file
    sourceid: python
    spec:
      file: .mise.toml
      matchpattern: (?m)^(python = ")[^"]+(")$
      replacepattern: ${1}{{ source "python" }}${2}
  ruff:
    kind: file
    sourceid: ruff
    spec:
      file: .mise.toml
      matchpattern: (?m)^(ruff = ")[^"]+(")$
      replacepattern: ${1}{{ source "ruff" }}${2}
  updatecli:
    kind: file
    sourceid: updatecli
    spec:
      file: .mise.toml
      matchpattern: (?m)^(updatecli = ")[^"]+(")$
      replacepattern: ${1}{{ source "updatecli" }}${2}
