substitutions:
  light_name: Night Light
  light_num_leds: 8
  name: bathroom-ducky
  name_friendly: Bathroom Ducky

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml
  ducky: !include packages/ducky.yaml
  web_server: !include packages/web-server.yaml

binary_sensor:
  - platform: ld2410
    has_moving_target:
      id: radar_has_moving_target
      name: Radar Moving Target
    has_still_target:
      id: radar_has_still_target
      name: Radar Still Target
    has_target:
      id: radar_has_target
      name: Radar Target

button:
  - platform: ld2410
    factory_reset:
      name: Factory Reset Radar
    query_params:
      name: Query Params
    restart:
      name: Restart Radar

ld2410:

number:
  - platform: ld2410
    max_move_distance_gate:
      name: Radar Max Move Distance
    max_still_distance_gate:
      name: Radar Max Still Distance
    timeout:
      name: Radar Timeout

select:
  - platform: ld2410
    distance_resolution:
      name: Radar Gate Size

sensor:
  - platform: ld2410
    detection_distance:
      name: Radar Detection Distance
      filters:
        - throttle_with_priority: 1000ms
        - lambda: |-
            return id(radar_has_target).state ? x : NAN;
        - or:
            - delta: 5.0
            - heartbeat: 60s
    moving_distance:
      name: Radar Moving Distance
      filters:
        - throttle_with_priority: 1000ms
        - lambda: |-
            return id(radar_has_moving_target).state ? x : NAN;
        - or:
            - delta: 5.0
            - heartbeat: 60s
    moving_energy:
      name: Radar Move Energy
      filters:
        - throttle_with_priority: 1000ms
        - or:
            - delta: 5.0
            - heartbeat: 60s
    still_distance:
      name: Radar Still Distance
      filters:
        - throttle_with_priority: 1000ms
        - lambda: |-
            return id(radar_has_still_target).state ? x : NAN;
        - or:
            - delta: 5.0
            - heartbeat: 60s
    still_energy:
      name: Radar Still Energy
      filters:
        - throttle_with_priority: 1000ms
        - or:
            - delta: 5.0
            - heartbeat: 60s

switch:
  - platform: ld2410
    bluetooth:
      name: LD2410 Bluetooth
      restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  - platform: ld2410
    mac_address:
      entity_category: diagnostic
      name: Radar Bluetooth MAC
    version:
      entity_category: diagnostic
      name: Radar Firmware Version

uart:
  baud_rate: 256000
  rx_pin: GPIO23
  tx_pin: GPIO16
