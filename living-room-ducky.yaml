substitutions:
  name: living-room-ducky
  name_friendly: Living Room Ducky

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml
  web_server: !include packages/web-server.yaml

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    name: Lamp
    num_leds: 16
    pin: GPIO2
    rgb_order: GRB
