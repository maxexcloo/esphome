[tools]
# Cache ESPHome and its compatible interpreter together under Mise.
"pipx:esphome" = "2026.10.1"
# ESPHome requires Python below 3.15.
python = "3.14"

# Development
[tasks.check]
run = "scripts/esphome.sh config ./*.yaml"
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]
