[tools]
"pipx:esphome" = { version = "2026.9.1", uvx_args = "--python 3.14.8" }
python = "3.14.8"
ruff = "0.16.10"

[tasks.check]
description = "Lint components and validate device configurations"
run = """
ruff check components
ruff format --check components
config_log=$(mktemp)
trap 'rm -f "$config_log"' EXIT
for config_file in *.yaml; do
  if [ "$config_file" = "secrets.yaml" ]; then
    continue
  fi
  if ! esphome config "$config_file" >"$config_log"; then
    cat "$config_log"
    exit 1
  fi
done
"""

[tasks.fmt]
description = "Format Python components"
run = """
ruff check --fix --select I components
ruff format components
"""
