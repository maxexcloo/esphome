[tools]
# Cache ESPHome and its compatible interpreter together under Mise.
"pipx:esphome" = "2026.10.2"
# ESPHome requires Python below 3.15.
python = "3.14"

# Development
[tasks.check]
run = "mise run esphome config ./*.yaml"
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
]

[tasks.esphome]
description = "Run ESPHome With Secrets From fnox"
# An existing secrets.yaml, as in CI, is used as is.
run = '''
if [ ! -e secrets.yaml ]; then
  trap 'rm -f secrets.yaml' EXIT
  trap 'exit 130' INT TERM
  secrets=$(op-connect fnox export --format json)
  (umask 077 && printf '%s\n' "$secrets" | jq .secrets >secrets.yaml)
fi
esphome
'''
