[vars]
python_paths = "components"
ruff_args = "--extend-select I"

[tools]
# Cache ESPHome and its compatible interpreter together under Mise.
"pipx:esphome" = "2026.9.1"
python = "3.14.8"

# Development
[tasks.check]
depends = ["check:actions", "check:python", "check:updates"]
run = "bash scripts/check.sh"

[tasks.fmt]
depends = ["fmt:python"]

# Dependencies
# Python follows the separate 3.14 compatibility policy.
[tasks."dependencies:mise:check"]
run = "mise upgrade --bump --dry-run --local --no-prune pipx:esphome"

[tasks."dependencies:mise:update"]
run = "mise upgrade --bump --local --no-prune pipx:esphome"
