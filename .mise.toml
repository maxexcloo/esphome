[tools]
# ESPHome uses Python 3.14 independently of repository linting tools.
"pipx:esphome" = { uvx_args = "--python 3.14.8", version = "2026.9.1" }
python = "3.15.0"
ruff = "0.17.0"
updatecli = "0.122.1"

[tasks.check]
description = "Lint Components & Validate Device Configurations"
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
ruff check --extend-select I components
ruff format --check components
config_log=$(mktemp)
trap 'rm -f "$config_log"' EXIT
for config_file in *.yaml; do
  if [ "$config_file" = "secrets.yaml" ]; then
    continue
  fi
  if ! esphome config "$config_file" >"$config_log"; then
    cat "$config_log"
    exit 1
  fi
done
"""

[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""

[tasks.fmt]
description = "Format Python Components"
run = """
ruff check --fix --select I components
ruff format components
"""
