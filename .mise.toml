[tools]
# ESPHome requires Python below 3.15.
"pipx:esphome" = { version = "2026.10.0", uvx_args = "--python 3.14" }

# Development
[tasks.check]
run = "esphome config ./*.yaml"
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]
