[vars]
python_paths = "components"
ruff_args = "--extend-select I"

[tools]
# ESPHome uses Python 3.14 independently of repository linting tools.
"pipx:esphome" = { uvx_args = "--python 3.14.8", version = "2026.9.1" }

# Development
[tasks.check]
depends = ["check:actions", "check:python", "check:updates"]
run = "bash scripts/check.sh"

[tasks.fmt]
depends = ["fmt:python"]
