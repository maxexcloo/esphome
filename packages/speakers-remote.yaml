packages:
  m5stack_atom: !include m5stack-atom.yaml

binary_sensor:
  - platform: gpio
    name: Button
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute: toggle_mute
    pin:
      inverted: true
      number: GPIO39
  - platform: homeassistant
    attribute: is_volume_muted
    entity_id: ${entity_speakers}
    id: current_mute_state
  # NEC codes from the speakers' remote.
  - platform: remote_receiver
    internal: true
    name: IR Mute
    nec:
      address: 0xFF00
      command: 0xBB44
    on_press:
      - script.execute: toggle_mute
  - platform: remote_receiver
    internal: true
    name: IR Volume Down
    nec:
      address: 0xFF00
      command: 0xE916
    on_press:
      - script.execute: volume_down
  - platform: remote_receiver
    internal: true
    name: IR Volume Up
    nec:
      address: 0xFF00
      command: 0xE619
    on_press:
      - script.execute: volume_up

button:
  - platform: template
    name: Mute
    on_press:
      - script.execute: toggle_mute
  - platform: template
    name: Volume Down
    on_press:
      - script.execute: volume_down
  - platform: template
    name: Volume Up
    on_press:
      - script.execute: volume_up

remote_receiver:
  pin:
    inverted: true
    mode: INPUT_PULLUP
    number: GPIO32

script:
  - id: flash_red
    then:
      - light.turn_on:
          blue: 0%
          flash_length: 100ms
          green: 0%
          id: status_led
          red: 100%
  - id: toggle_mute
    then:
      - script.execute: flash_red
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: ${entity_speakers}
            is_volume_muted: !lambda return !id(current_mute_state).state;
  - id: volume_down
    then:
      - script.execute: flash_red
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: ${entity_speakers}
  - id: volume_up
    then:
      - script.execute: flash_red
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: ${entity_speakers}
