packages:
  apolloautomation.msr-2: github://ApolloAutomation/MSR-2/Integrations/ESPHome/MSR-2_BLE.yaml@48f5d4f7847a3866fb135cbe8d4791fade3a5dfe
  web_server: !include web-server.yaml

api:
  encryption:
    key: !secret api_encryption_key

esphome:
  friendly_name: ${name_friendly}
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: ApolloAutomation.MSR-2

ota:
  - id: !extend ota_esphome
    encryption:

sensor:
  - name: WiFi Signal
    id: !extend wifi_signal_db

# Disable upstream's plaintext browser OTA, which OTA encryption does not cover.
web_server:
  ota: false

wifi:
  password: !secret wifi_password
  ssid: !secret wifi_ssid
