packages:
  apolloautomation.msr-2: github://ApolloAutomation/MSR-2/Integrations/ESPHome/MSR-2_BLE.yaml@dee988c50b0afd9765e21b0c3b59807bce152ec1

api:
  encryption:
    key: !secret api_encryption_key

esphome:
  friendly_name: ${name_friendly}
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: ApolloAutomation.MSR-2

ota:
  - id: !extend ota_esphome
    encryption:

sensor:
  - name: WiFi Signal
    id: !extend wifi_signal_db

wifi:
  password: !secret wifi_password
  ssid: !secret wifi_ssid
