packages:
  apolloautomation.msr-2: github://ApolloAutomation/MSR-2/Integrations/ESPHome/MSR-2_BLE.yaml@48f5d4f7847a3866fb135cbe8d4791fade3a5dfe
  web_server: !include web-server.yaml

api:
  encryption:
    key: !secret api_encryption_key

# Upstream's update entities install Apollo's stock image, which drops this
# configuration, so firmware comes only from this repository.
button:
  - id: !remove update_firmware

esphome:
  friendly_name: ${name_friendly}
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: ApolloAutomation.MSR-2

http_request: !remove

ota:
  - id: !extend ota_esphome
    encryption:
  - id: !remove ota_managed

# Upstream's on_boot still calls this script, so keep it as a no-op.
script:
  - id: !remove apply_ota_source
  - id: apply_ota_source
    then:
      - logger.log: Apollo firmware updates are disabled

select:
  - id: !remove firmware_channel

sensor:
  - name: WiFi Signal
    id: !extend wifi_signal_db

update:
  - id: !remove update_http_request

# Disable upstream's plaintext browser OTA, which OTA encryption does not cover.
web_server:
  ota: false

wifi:
  on_connect: !remove
  password: !secret wifi_password
  ssid: !secret wifi_ssid
