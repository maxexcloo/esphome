substitutions:
  name: hallway-front-door-intercom
  name_friendly: Hallway Front Door Intercom

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml

binary_sensor:
  - platform: template
    device_class: sound
    icon: mdi:volume-high
    id: intercom_audio
    name: Intercom Audio
    filters:
      - delayed_off: 3s
    lambda: |-
      return id(speaker_pulse_rate).state > 300.0;
  - platform: template
    icon: mdi:bell-ring
    id: recent_call
    name: Recent Call

button:
  - platform: template
    icon: mdi:door-open
    id: unlock_door
    name: Unlock Door
    on_press:
      - switch.turn_on: unlock_relay
      - delay: 300ms
      - switch.turn_off: unlock_relay

esp32:
  board: m5stack-atom

esphome:
  on_boot:
    - binary_sensor.template.publish:
        id: recent_call
        state: false

sensor:
  - platform: pulse_counter
    id: speaker_pulse_rate
    name: Speaker Activity
    update_interval: 1s
    pin:
      mode: INPUT_PULLUP
      number: GPIO21

script:
  # An RS-485 frame indicates a call; retain it for ten minutes after the most
  # recent frame so Home Assistant cannot miss the event.
  - id: hold_recent_call
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: recent_call
          state: true
      - delay: 10min
      - binary_sensor.template.publish:
          id: recent_call
          state: false

switch:
  - platform: gpio
    id: unlock_relay
    internal: true
    pin: GPIO19
    restore_mode: ALWAYS_OFF

uart:
  baud_rate: 9600
  rx_pin: GPIO32
  tx_pin: GPIO26
  debug:
    direction: RX
    dummy_receiver: true
    sequence:
      - script.execute: hold_recent_call
