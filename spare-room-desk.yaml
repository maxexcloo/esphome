substitutions:
  name: spare-room-desk
  name_friendly: Spare Room Desk
  rx_pin: GPIO26
  tx_pin: GPIO32

packages:
  deskup_pro: github://smarthomeguys/deskup-pro-controller-rj12/deskup-pro-controller.yaml@efe4780eb1796300464232e5ccff8424f142a8df

api:
  encryption:
    key: !secret api_encryption_key

button:
  - id: !extend button_reboot
    name: ESP Reboot

esp32:
  board: m5stack-atom

esphome:
  friendly_name: ${name_friendly}
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: Espressif.m5stack-atom

logger:
  level: WARN

ota:
  - id: !extend ota_esphome
    password: !secret ota_password

safe_mode:

sensor:
  - id: !extend sensor_deviceuptime
    name: Uptime
  - platform: wifi_signal
    disabled_by_default: true
    entity_category: diagnostic
    name: WiFi Signal
    update_interval: 60s

wifi:
  password: !secret wifi_password
  ssid: !secret wifi_ssid
