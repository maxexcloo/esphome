substitutions:
  name: spare-room-desk
  name_friendly: Spare Room Desk
  rx_pin: GPIO26
  tx_pin: GPIO32

packages:
  # Apply local base settings after the upstream defaults.
  deskup_pro: github://smarthomeguys/deskup-pro-controller-rj12/deskup-pro-controller.yaml@d7e75ce1aba5330b1808bc5cf5af383fdebd9bbb
  base: !include packages/base.yaml

button:
  - id: !extend button_reboot
    name: ESP Reboot

esp32:
  board: m5stack-atom

esphome:
  name_add_mac_suffix: false
  project:
    name: Espressif.m5stack-atom

ota:
  # Use the authenticated OTA platform from base instead of the upstream entry.
  - id: !remove ota_esphome

sensor:
  - id: !extend sensor_deviceuptime
    name: Uptime
  - platform: wifi_signal
    disabled_by_default: true
    entity_category: diagnostic
    name: WiFi Signal
