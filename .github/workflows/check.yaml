name: Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          project-tools: true
          tools: actionlint node oxfmt ruff shellcheck updatecli uv
      - name: Create Test Secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'web_server_password: test-password' \
            'web_server_username: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run Checks
        run: mise run check
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          key: esp-idf-${{ runner.os }}-${{ hashFiles('.mise.toml') }}
          path: ~/.cache/esphome/idf
      - name: Compile Bedroom Fan
        run: mise exec -- esphome compile bedroom-fan.yaml
