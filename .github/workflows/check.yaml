name: Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.devices.outputs.configurations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.5
      - name: Create Test Secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run Checks
        run: mise run check
      - name: Discover Devices
        id: devices
        run: |
          configurations=$(jq -cn '$ARGS.positional - ["secrets.yaml"]' --args -- *.yaml)
          echo "configurations=$configurations" >> "$GITHUB_OUTPUT"
  compile:
    name: Compile ${{ matrix.configuration }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.check.outputs.configurations) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.5
      - name: Create Test Secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Compile Firmware
        run: mise exec -- esphome compile "${{ matrix.configuration }}"
