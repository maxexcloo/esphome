name: Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          project-tools: true
          tools: actionlint jq node@24 npm:renovate oxfmt ruff shellcheck uv
      - name: Create Test Secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'web_server_password: test-password' \
            'web_server_username: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run Checks
        run: mise run check
      - id: esphome
        name: Read ESPHome Version
        run: |
          version=$(mise exec -- esphome version)
          echo "version=${version#Version: }" >> "$GITHUB_OUTPUT"
      # ESPHome pins its ESP-IDF release, so the framework changes only with ESPHome.
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          key: esp-idf-${{ runner.os }}-${{ steps.esphome.outputs.version }}
          path: ~/.cache/esphome/idf
      - name: Restore Build Objects
        uses: actions/cache/restore@v6
        with:
          key: esphome-build-${{ runner.os }}-${{ steps.esphome.outputs.version }}-${{ github.sha }}
          path: .esphome/build
          restore-keys: esphome-build-${{ runner.os }}-${{ steps.esphome.outputs.version }}-
      - name: Compile Bedroom Fan
        run: mise exec -- esphome compile bedroom-fan.yaml
      # Only main saves build objects so pull requests reuse them without growing the cache.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Save Build Objects
        uses: actions/cache/save@v6
        with:
          key: esphome-build-${{ runner.os }}-${{ steps.esphome.outputs.version }}-${{ github.sha }}
          path: .esphome/build
