name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Global Tools
        run: |
          mkdir -p "$HOME/.config/mise"
          sed -n '/^\[tools\]$/p; s/^# \([^ ]* = "latest"\)$/\1/p' .mise.toml > "$HOME/.config/mise/config.toml"
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.9
      - name: Create Test Secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run Checks
        run: mise run check
