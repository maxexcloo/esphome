name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
      - name: Create test secrets
        run: |
          printf '%s\n' \
            'api_encryption_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run checks
        run: mise run check
  compile:
    name: Compile ${{ matrix.configuration }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - bathroom-ducky.yaml
          - bedroom-fan.yaml
          - biltong-box.yaml
          - hallway-front-door-intercom.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
      - name: Create test secrets
        run: |
          printf '%s\n' \
            'api_encryption_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Compile firmware
        run: mise exec -- esphome compile "${{ matrix.configuration }}"
