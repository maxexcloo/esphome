name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.devices.outputs.configurations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.3
      - name: Create test secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Run checks
        run: mise run check
      - name: Discover devices
        id: devices
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          configurations = sorted(path.name for path in Path('.').glob('*.yaml') if path.name != 'secrets.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'configurations={json.dumps(configurations)}', file=output)
  compile:
    name: Compile ${{ matrix.configuration }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.check.outputs.configurations) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.3
      - name: Create test secrets
        run: |
          printf '%s\n' \
            "api_encryption_key: $(openssl rand -base64 32)" \
            'ota_password: test' \
            'wifi_password: test-password' \
            'wifi_ssid: test-network' \
            >secrets.yaml
      - name: Compile firmware
        run: mise exec -- esphome compile "${{ matrix.configuration }}"
