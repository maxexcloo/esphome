# ENV III's QMP6988 already uses 0x70 on the Grove bus. Set the PaHub v2.1
# DIP switches to address 0x71 before connecting it through the Grove Y cable.
tca9548a:
  - address: 0x71
    i2c_id: grove_i2c
    id: scales_hub
    channels:
      - bus_id: scale_bus_1
        channel: 0
      - bus_id: scale_bus_2
        channel: 1
      - bus_id: scale_bus_3
        channel: 2
      - bus_id: scale_bus_4
        channel: 3
      - bus_id: scale_bus_5
        channel: 4
      - bus_id: scale_bus_6
        channel: 5
