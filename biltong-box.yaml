substitutions:
  name: biltong-box
  name_friendly: Biltong Box

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml
  scale_1: !include { file: packages/mini-scale.yaml, vars: { scale: 1 } }
  scale_2: !include { file: packages/mini-scale.yaml, vars: { scale: 2 } }
  scale_3: !include { file: packages/mini-scale.yaml, vars: { scale: 3 } }
  scale_4: !include { file: packages/mini-scale.yaml, vars: { scale: 4 } }
  scale_5: !include { file: packages/mini-scale.yaml, vars: { scale: 5 } }
  scale_6: !include { file: packages/mini-scale.yaml, vars: { scale: 6 } }
  web_server: !include packages/web-server.yaml

button:
  - platform: template
    entity_category: config
    name: Calibrate All Scales
    on_press:
      - lambda: |-
          const float reference_weight = id(scale_calibration_weight).state;
          mini_scale::calibrate(id(scale_1), "Scale 1", reference_weight);
          mini_scale::calibrate(id(scale_2), "Scale 2", reference_weight);
          mini_scale::calibrate(id(scale_3), "Scale 3", reference_weight);
          mini_scale::calibrate(id(scale_4), "Scale 4", reference_weight);
          mini_scale::calibrate(id(scale_5), "Scale 5", reference_weight);
          mini_scale::calibrate(id(scale_6), "Scale 6", reference_weight);
  - platform: template
    entity_category: config
    name: Tare All Scales
    on_press:
      - lambda: |-
          mini_scale::tare(id(scale_1), "Scale 1");
          mini_scale::tare(id(scale_2), "Scale 2");
          mini_scale::tare(id(scale_3), "Scale 3");
          mini_scale::tare(id(scale_4), "Scale 4");
          mini_scale::tare(id(scale_5), "Scale 5");
          mini_scale::tare(id(scale_6), "Scale 6");

esp32:
  board: m5stack-timer-cam

# GPIO5 and GPIO15 are strapping pins fixed by the TimerCamera-F camera wiring.
esp32_camera:
  href_pin: GPIO26
  i2c_id: camera_i2c
  name: Camera
  pixel_clock_pin: GPIO21
  reset_pin: GPIO15
  vsync_pin: GPIO22
  # OV3660 D0 through D7; this hardware-defined list order is significant.
  data_pins:
    - GPIO32
    - GPIO35
    - GPIO34
    - GPIO5
    - GPIO39
    - GPIO18
    - GPIO36
    - GPIO19
  external_clock:
    pin: GPIO27

esphome:
  includes:
    - components/mini_scale.h

i2c:
  # Dedicated SCCB bus for the OV3660 camera.
  - id: camera_i2c
    frequency: 100kHz
    scan: false
    scl: GPIO23
    sda: GPIO25
  # TimerCamera-F HY2.0-4P (Grove) port.
  - id: grove_i2c
    frequency: 100kHz
    scl: GPIO13
    sda: GPIO4

number:
  - platform: template
    entity_category: config
    id: scale_calibration_weight
    initial_value: 1000
    max_value: 5000
    min_value: 1
    name: Scale Calibration Weight
    optimistic: true
    restore_value: true
    step: 1
    unit_of_measurement: g

psram:
  speed: 80MHz

sensor:
  - platform: qmp6988
    i2c_id: grove_i2c
    iir_filter: 2x
    pressure:
      name: Air Pressure
      oversampling: 16x
  - platform: sht3xd
    i2c_id: grove_i2c
    humidity:
      name: Humidity
    temperature:
      name: Temperature

# ENV III's QMP6988 already uses 0x70 on the Grove bus. Set the PaHub v2.1
# DIP switches to address 0x71 before connecting it through the Grove Y cable.
tca9548a:
  - id: scales_hub
    address: 0x71
    i2c_id: grove_i2c
    channels:
      - bus_id: scale_bus_1
        channel: 0
      - bus_id: scale_bus_2
        channel: 1
      - bus_id: scale_bus_3
        channel: 2
      - bus_id: scale_bus_4
        channel: 3
      - bus_id: scale_bus_5
        channel: 4
      - bus_id: scale_bus_6
        channel: 5
