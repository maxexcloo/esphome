    update_interval: 5s
    lambda: |-
      uint8_t data[4];
      if (id(scale_3).read_register(0x10, data, sizeof(data)) !=
          esphome::i2c::ERROR_OK) {
        return NAN;
      }
      float weight;
      memcpy(&weight, data, sizeof(weight));
      return weight;
  - platform: template
    device_class: weight
    name: Scale 4 Weight
    state_class: measurement
    unit_of_measurement: g
    update_interval: 5s
    lambda: |-
      uint8_t data[4];
      if (id(scale_4).read_register(0x10, data, sizeof(data)) !=
          esphome::i2c::ERROR_OK) {
        return NAN;
      }
      float weight;
      memcpy(&weight, data, sizeof(weight));
      return weight;
  - platform: template
    device_class: weight
    name: Scale 5 Weight
    state_class: measurement
    unit_of_measurement: g
    update_interval: 5s
    lambda: |-
      uint8_t data[4];
      if (id(scale_5).read_register(0x10, data, sizeof(data)) !=
