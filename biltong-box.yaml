substitutions:
  name: biltong-box
  name_friendly: Biltong Box

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml
  web_server: !include packages/web-server.yaml

button:
  - platform: template
    entity_category: config
    name: Calibrate All Scales
    on_press:
      - lambda: |-
          const float reference_weight = id(scale_calibration_weight).state;
          mini_scale::calibrate(id(scale_1), "Scale 1", reference_weight);
          mini_scale::calibrate(id(scale_2), "Scale 2", reference_weight);
          mini_scale::calibrate(id(scale_3), "Scale 3", reference_weight);
          mini_scale::calibrate(id(scale_4), "Scale 4", reference_weight);
          mini_scale::calibrate(id(scale_5), "Scale 5", reference_weight);
          mini_scale::calibrate(id(scale_6), "Scale 6", reference_weight);
  - platform: template
    entity_category: config
    name: Calibrate Scale 1
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_1), "Scale 1", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Calibrate Scale 2
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_2), "Scale 2", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Calibrate Scale 3
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_3), "Scale 3", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Calibrate Scale 4
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_4), "Scale 4", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Calibrate Scale 5
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_5), "Scale 5", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Calibrate Scale 6
    on_press:
      - lambda: |-
          mini_scale::calibrate(
              id(scale_6), "Scale 6", id(scale_calibration_weight).state);
  - platform: template
    entity_category: config
    name: Tare All Scales
    on_press:
      - lambda: |-
          mini_scale::tare(id(scale_1), "Scale 1");
          mini_scale::tare(id(scale_2), "Scale 2");
          mini_scale::tare(id(scale_3), "Scale 3");
          mini_scale::tare(id(scale_4), "Scale 4");
          mini_scale::tare(id(scale_5), "Scale 5");
          mini_scale::tare(id(scale_6), "Scale 6");
  - platform: template
    entity_category: config
    name: Tare Scale 1
    on_press:
      - lambda: mini_scale::tare(id(scale_1), "Scale 1");
  - platform: template
    entity_category: config
    name: Tare Scale 2
    on_press:
      - lambda: mini_scale::tare(id(scale_2), "Scale 2");
  - platform: template
    entity_category: config
    name: Tare Scale 3
    on_press:
      - lambda: mini_scale::tare(id(scale_3), "Scale 3");
  - platform: template
    entity_category: config
    name: Tare Scale 4
    on_press:
      - lambda: mini_scale::tare(id(scale_4), "Scale 4");
  - platform: template
    entity_category: config
    name: Tare Scale 5
    on_press:
      - lambda: mini_scale::tare(id(scale_5), "Scale 5");
  - platform: template
    entity_category: config
    name: Tare Scale 6
    on_press:
      - lambda: mini_scale::tare(id(scale_6), "Scale 6");

esp32:
  board: m5stack-timer-cam

# GPIO5 and GPIO15 are strapping pins fixed by the TimerCamera-F camera wiring.
esp32_camera:
  href_pin: GPIO26
  i2c_id: camera_i2c
  name: Camera
  pixel_clock_pin: GPIO21
  reset_pin: GPIO15
  vsync_pin: GPIO22
  # OV3660 D0 through D7; this hardware-defined list order is significant.
  data_pins:
    - GPIO32
    - GPIO35
    - GPIO34
    - GPIO5
    - GPIO39
    - GPIO18
    - GPIO36
    - GPIO19
  external_clock:
    pin: GPIO27

esphome:
  includes:
    - components/mini_scale.h

i2c:
  # Dedicated SCCB bus for the OV3660 camera.
  - frequency: 100kHz
    id: camera_i2c
    scan: false
    scl: GPIO23
    sda: GPIO25
  # TimerCamera-F HY2.0-4P (Grove) port.
  - frequency: 100kHz
    id: grove_i2c
    scl: GPIO13
    sda: GPIO4

i2c_device:
  - address: 0x26
    i2c_id: scale_bus_1
    id: scale_1
  - address: 0x26
    i2c_id: scale_bus_2
    id: scale_2
  - address: 0x26
    i2c_id: scale_bus_3
    id: scale_3
  - address: 0x26
    i2c_id: scale_bus_4
    id: scale_4
  - address: 0x26
    i2c_id: scale_bus_5
    id: scale_5
  - address: 0x26
    i2c_id: scale_bus_6
    id: scale_6

number:
  - platform: template
    entity_category: config
    id: scale_calibration_weight
    initial_value: 1000
    max_value: 5000
    min_value: 1
    name: Scale Calibration Weight
    optimistic: true
    restore_value: true
    step: 1
    unit_of_measurement: g

psram:
  speed: 80MHz

sensor:
  - platform: qmp6988
    i2c_id: grove_i2c
    iir_filter: 2x
    pressure:
      name: Air Pressure
      oversampling: 16x
  - platform: sht3xd
    i2c_id: grove_i2c
    humidity:
      name: Humidity
    temperature:
      name: Temperature
  # Unit Mini Scales returns its calibrated weight in grams as a
  # little-endian IEEE-754 float from register 0x10.
  - platform: template
    device_class: weight
    name: Scale 1 Weight
    state_class: measurement
    unit_of_measurement: g
    update_interval: 5s
    lambda: |-
      uint8_t data[4];
      if (id(scale_1).read_register(0x10, data, sizeof(data)) !=
          esphome::i2c::ERROR_OK) {
        return NAN;
      }
      float weight;
      memcpy(&weight, data, sizeof(weight));
      return weight;
  - platform: template
    device_class: weight
    name: Scale 2 Weight
    state_class: measurement
    unit_of_measurement: g
    update_interval: 5s
    lambda: |-
      uint8_t data[4];
      if (id(scale_2).read_register(0x10, data, sizeof(data)) !=
