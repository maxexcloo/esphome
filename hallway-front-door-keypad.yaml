substitutions:
  name: hallway-front-door-keypad
  name_friendly: Hallway Front Door Keypad

packages:
  base: !include packages/base.yaml
  diagnostics: !include packages/diagnostics.yaml
  m5stack_atom: !include packages/m5stack-atom.yaml

external_components:
  - source: github://pierluigizagaria/switchbot-keypad-bridge@51d5049080232f4a2b7fa843a9411e57af88416b
    components: [switchbot_keypad_bridge]

switchbot_keypad_bridge:
  keypad:
    name: Keypad
  keypad_action:
    name: Action
  keypad_battery_level:
    name: Keypad Battery
  on_unlock:
    - homeassistant.event:
        event: esphome.switchbot_keypad_unlock
        data:
          index: !lambda "return to_string(index);"
          method: !lambda "return method;"
  reset_button:
    name: Reset

time:
  - platform: sntp
